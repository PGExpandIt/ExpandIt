# Non-secret configuration. Everything here is readable by anyone with cluster
# access - the mailbox password and the shared secret live in the Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mailer-config
  labels:
    app.kubernetes.io/name: vallus-mailer
data:
  # 587 = STARTTLS, what Infomaniak recommends. Port 25 is blocked outbound on
  # Infomaniak Public Cloud; 587 and 465 are not, and this connection is
  # authenticated anyway.
  SMTP_HOST: mail.infomaniak.com
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: sales@vallus.eu

  MAIL_FROM: sales@vallus.eu
  MAIL_FROM_NAME: vallus

  CODE_SUBJECT: Your vallus verification code
  CODE_BODY: "Your vallus verification code is {code}. It is valid for {minutes} minutes. If you did not request this, ignore this e-mail."
  CODE_TTL_MINUTES: "10"
  # Footer under the message. The webmail signature is not applied to SMTP
  # sends, so it is repeated here. \n becomes a line break.
  MAIL_SIGNATURE: ""

  SEND_RATE_LIMIT_PER_HOUR: "5"

  PORT: "8790"
  # The code defaults to loopback, which would make the port unreachable from the
  # Service. Inside the pod the network boundary is the NetworkPolicy, not the bind.
  BIND_HOST: 0.0.0.0
