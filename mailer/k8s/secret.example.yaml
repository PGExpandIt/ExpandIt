# Template only - do NOT commit the filled-in version. Prefer creating it straight
# from the shell so the values never touch the disk:
#
#   kubectl create secret generic mailer-secrets \
#     --from-literal=SMTP_PASS='…' \
#     --from-literal=MAILER_AUTH_SECRET='…' \
#     --from-literal=FREE_LICENSE_KEY_B64="$(base64 < free-private.pem | tr -d '\n')"
#
# FREE_LICENSE_KEY_B64 is optional: leave it out and /send-license stays off.
#
# MAILER_AUTH_SECRET must equal KCHAT_MAILER_SECRET on the edge script:
#   node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
apiVersion: v1
kind: Secret
metadata:
  name: mailer-secrets
  labels:
    app.kubernetes.io/name: vallus-mailer
type: Opaque
stringData:
  SMTP_PASS: ""
  MAILER_AUTH_SECRET: ""
  FREE_LICENSE_KEY_B64: ""
