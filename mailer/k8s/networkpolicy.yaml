# Optional but cheap: the mailer should reach exactly one thing outbound - the
# Infomaniak SMTP server - and be reachable from exactly one thing inbound.
# Requires a CNI that enforces policy (Cilium/Calico); on a CNI that ignores it
# this file is a no-op, not an error, so verify before relying on it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailer
  labels:
    app.kubernetes.io/name: vallus-mailer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vallus-mailer
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8790
  egress:
    # DNS, to resolve mail.infomaniak.com.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # SMTP over STARTTLS. Port 25 is deliberately absent - it is blocked
    # upstream anyway, and this service has no reason to speak it.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 587
