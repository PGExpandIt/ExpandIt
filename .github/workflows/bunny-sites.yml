# Generated by `bunny sites ci init`, then extended with the build-time API origin
# and the rooting check - see the two commented steps below.
#
# Pull requests get a preview deploy with its own URL; pushes to main go live.
# Deploys are atomic and can be rolled back with `bunny sites deployments publish`.
#
# Required repository secret:
#   BUNNY_API_KEY        bunny.net → Account Settings → API
# Optional repository variables:
#   BOOKING_API_ORIGIN   e.g. https://api.vallus.eu - without it the demo section
#                        falls back to the example calendar and a mailto request
#   KCHAT_API_ORIGIN     the kChat relay base. Set to the same-origin path
#                        "/api/kchat" (a pull-zone edge rule proxies it to the
#                        relay script); or the relay's *.bunny.run URL for a direct
#                        cross-origin call. Unset → the contact form uses mailto.
#   LICENSE_API_ORIGIN   the free-licence request endpoint (the kChat relay's
#                        /register). Same values as above; unset → /free uses mailto.

name: Deploy site
on:
  push:
    branches: [main]
  pull_request:

# One deploy at a time per ref; a newer commit cancels the older build.
concurrency:
  group: bunny-sites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork PRs have no access to secrets; skip instead of failing.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write # preview comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci
      # `eslint .` - `next lint` was removed in Next.js 16 and left this step
      # failing on every run, which blocked the deploy. Build output and the
      # sibling services are excluded in eslint.config.mjs.
      - run: npm run lint

      - run: npm run build
        env:
          # Baked into the bundle at build time. Leave the variable unset and the
          # site deploys in offline mode - which looks fine and quietly does not
          # book anything.
          NEXT_PUBLIC_BOOKING_API: ${{ vars.BOOKING_API_ORIGIN }}
          # Same pattern for the kChat contact form: unset → the form quietly falls
          # back to a mailto request.
          NEXT_PUBLIC_KCHAT_API: ${{ vars.KCHAT_API_ORIGIN }}
          # The /free licence-request form. Currently the kChat relay's /register;
          # unset → the form quietly falls back to a mailto request.
          NEXT_PUBLIC_LICENSE_API: ${{ vars.LICENSE_API_ORIGIN }}

      # basePath must be empty for a root-domain deployment. If it is not, every
      # asset is requested under a prefix that does not exist and the site loads
      # with no styling at all - easy to miss until someone visits.
      - name: Check the export is rooted correctly
        run: |
          if grep -q 'href="/[^"/][^"]*/_next/' out/index.html; then
            echo "::error::out/index.html requests assets under a basePath prefix."
            echo "Set basePath to '' in next.config.ts for a root-domain deployment."
            grep -o 'href="[^"]*_next[^"]*"' out/index.html | head -3
            exit 1
          fi
          test -f out/index.html && test -f out/404.html
          echo "Export looks right: assets at /_next/, index.html and 404.html present."

      - uses: BunnyWay/actions/deploy-site@deploy-site_1.0.0
        with:
          site: "vallus"
          directory: "out"
          production: ${{ github.event_name == 'push' }}
          api_key: ${{ secrets.BUNNY_API_KEY }}
